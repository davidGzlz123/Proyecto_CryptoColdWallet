name: Run Tests

on:
  push:
    branches: ["atzin"]
  pull_request:
    branches: ["atzin"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install cryptography pytest argon2-cffi

    - name: Run test suite
      run: pytest -q
